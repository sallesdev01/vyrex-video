<!doctype html>
<!--
  Funil 3D: rastros de luz lima atravessam um chão em perspectiva e convergem no vértice do V,
  que acende conforme eles chegam ("o ponto onde todo o tráfego converge: a venda").
  Seek-safe: as curvas e os tempos de cada rastro são sorteados uma vez com semente fixa;
  cada frame é render(t), puxado por um relógio GSAP linear.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VYREX — funil</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-700.woff2") format("woff2");
        font-weight: 700;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #fn-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #fn-canvas {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      #fn-caption {
        position: absolute;
        left: 120px;
        top: 110px;
        width: 1100px;
        font-family: "Unbounded";
        font-weight: 700;
        font-size: 76px;
        line-height: 1.08;
        letter-spacing: -0.03em;
        color: #f5f5f0;
      }
      .fn-w {
        display: inline-block;
      }
      #fn-accent {
        color: #c6ff1a;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-rlc1"
      id="fn-root"
      data-composition-id="funnel"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <canvas data-hf-id="hf-n4o2" id="fn-canvas" class="clip" data-start="0" data-duration="5" data-track-index="1"></canvas>
      <h2 data-hf-id="hf-6221" id="fn-caption">
        <span data-hf-id="hf-co2p" class="fn-w">Todo</span> <span data-hf-id="hf-g4iq" class="fn-w">clique</span> <span data-hf-id="hf-2o4w" class="fn-w">converge</span><br data-hf-id="hf-x5px" />
        <span data-hf-id="hf-tqmn" class="fn-w">para</span> <span data-hf-id="hf-v0k8" class="fn-w">a</span> <span data-hf-id="hf-mdro" id="fn-accent" class="fn-w">venda</span>
      </h2>
    </div>

    <script>
      (function () {
        var root = document.getElementById("fn-root");
        var duration = Math.max(0.001, parseFloat(root.dataset.duration) || 5);
        var clock = { t: 0 };
        var scene = { duration: duration, clock: clock, render: null };
        window.__vyrexFunnel = scene;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["funnel"] = new Promise(function (resolve) {
          scene.ready = resolve;
        });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (scene.render) scene.render(clock.t);
          },
        });
        tl.fromTo(
          ".fn-w",
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.08 },
          0.7,
        );
        tl.to("#fn-caption", { opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power3.in" }, 4.6);
        window.__timelines = window.__timelines || {};
        window.__timelines["funnel"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";

      const host = window.__vyrexFunnel;
      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("fn-canvas"),
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x0a0a0a, 9, 34);

      const studio = new THREE.Scene();
      studio.background = new THREE.Color(0x050505);
      const softbox = (w, h, x, y, z, color, power) => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }),
        );
        panel.position.set(x, y, z);
        panel.lookAt(0, 0, 0);
        studio.add(panel);
      };
      softbox(10, 2, 0, 7, 3, 0xffffff, 2.4);
      softbox(1.2, 7, -7, 1, 3, 0xffffff, 1.8);
      softbox(9, 1.4, 0, 0.5, -7, 0xc6ff1a, 1.6);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(studio, 0.02).texture;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a1a, 1.6));
      const key = new THREE.DirectionalLight(0xffffff, 1.4);
      key.position.set(-4, 6, 6);
      scene.add(key);

      // Chão: grade fina em perspectiva que some na névoa.
      const grid = new THREE.GridHelper(80, 80, 0x2b3a0c, 0x1a2008);
      scene.add(grid);

      // Brilho lima no chão, sob o vértice.
      const glowCanvas = document.createElement("canvas");
      glowCanvas.width = 256;
      glowCanvas.height = 256;
      const g = glowCanvas.getContext("2d");
      const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, "rgba(198,255,26,0.55)");
      grad.addColorStop(1, "rgba(198,255,26,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      const glowMat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(glowCanvas),
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const glow = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), glowMat);
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = 0.01;
      scene.add(glow);

      // O V de pé, com o vértice tocando o chão na origem.
      const toShape = (pts) => {
        const s = new THREE.Shape();
        pts.forEach(([x, y], i) => {
          const X = (x - 60) / 40;
          const Y = (47.5 - y) / 40;
          if (i === 0) s.moveTo(X, Y);
          else s.lineTo(X, Y);
        });
        s.closePath();
        return s;
      };
      const extrude = { depth: 0.5, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.045, bevelSegments: 4 };
      const geoL = new THREE.ExtrudeGeometry(toShape([[0, 0], [32, 0], [49.65, 41.7], [40.25, 95]]), extrude);
      const geoR = new THREE.ExtrudeGeometry(toShape([[120, 0], [88, 0], [55.65, 41.7], [46.25, 95]]), extrude);
      geoL.translate(0, 0, -0.25);
      geoR.translate(0, 0, -0.25);
      const matL = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.15, roughness: 0.4, envMapIntensity: 1.3 });
      const matR = new THREE.MeshStandardMaterial({
        color: 0xc6ff1a,
        emissive: 0xc6ff1a,
        emissiveIntensity: 0.2,
        metalness: 0.4,
        roughness: 0.32,
      });
      const symbol = new THREE.Group();
      symbol.add(new THREE.Mesh(geoL, matL), new THREE.Mesh(geoR, matR));
      // Vértice local em x = -0.43, y = -1.19: desloca para ele cair na origem.
      symbol.position.set(0.43, 1.19, 0);
      const stand = new THREE.Group();
      stand.add(symbol);
      stand.scale.setScalar(1.1);
      scene.add(stand);

      // Rastros: curvas sorteadas com semente fixa, do anel externo até o vértice.
      let seed = 20261026;
      const rand = () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
      const N = 56;
      const SEG = 96;
      const RAD = 4;
      const PER_SEG = RAD * 6;
      const trailMat = new THREE.MeshBasicMaterial({
        color: 0xc6ff1a,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const trails = [];
      for (let i = 0; i < N; i++) {
        const ang = (i / N) * Math.PI * 2 + rand() * 0.3;
        const r0 = 13 + rand() * 9;
        const start = new THREE.Vector3(Math.cos(ang) * r0, 0.03, Math.sin(ang) * r0);
        const bend = (rand() - 0.5) * 9;
        const mid = new THREE.Vector3(
          Math.cos(ang) * r0 * 0.45 + Math.cos(ang + Math.PI / 2) * bend,
          0.03,
          Math.sin(ang) * r0 * 0.45 + Math.sin(ang + Math.PI / 2) * bend,
        );
        const end = new THREE.Vector3(0, 0.03, 0);
        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
        const geo = new THREE.TubeGeometry(curve, SEG, 0.022 + rand() * 0.02, RAD, false);
        const mesh = new THREE.Mesh(geo, trailMat);
        mesh.frustumCulled = false;
        scene.add(mesh);
        trails.push({ geo, t0: 0.1 + rand() * 2.6, dur: 1.1 + rand() * 0.9, tail: 0.28 + rand() * 0.18 });
      }

      const camera = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.1, 120);
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const inOut = (x) => {
        const u = clamp01(x);
        return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      };
      const lerp = (a, b, k) => a + (b - a) * k;

      host.render = (t) => {
        // A câmera desce do alto e avança em direção ao V.
        const c = inOut(t / host.duration);
        camera.position.set(lerp(3, 0.6, c), lerp(10, 3.2, c), lerp(19, 8.5, c));
        camera.lookAt(0, lerp(0.4, 1.4, c), 0);

        let arrived = 0;
        for (const tr of trails) {
          const head = (t - tr.t0) / tr.dur;
          if (head <= 0) {
            tr.geo.setDrawRange(0, 0);
            continue;
          }
          if (head >= 1) arrived += 1;
          const h = Math.min(1, head);
          const tailStart = Math.max(0, h - tr.tail);
          // Depois de chegar, a cauda termina de entrar no vértice.
          const fade = clamp01((head - 1) / tr.tail);
          const s0 = Math.floor(lerp(tailStart, 1, fade) * SEG);
          const s1 = Math.ceil(h * SEG);
          tr.geo.setDrawRange(s0 * PER_SEG, Math.max(0, s1 - s0) * PER_SEG);
        }
        // O V acende conforme os cliques chegam.
        const lit = arrived / trails.length;
        matR.emissiveIntensity = 0.2 + 0.9 * lit;
        glow.material.opacity = 0.35 + 0.65 * lit;
        stand.rotation.y = lerp(-0.35, 0.15, c);

        renderer.render(scene, camera);
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
