    const tl = gsap.timeline({ paused: true });

    const K = 418 / 430;
    // Topo do trecho de preços no print, em px CSS: a rolagem para aqui.
    const SCROLL_TO = 5750;

    // O lima do íris da abertura se recolhe no brilho.
    tl.fromTo("#ph-flash", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0);

    // O celular sobe com o site real na tela.

    tl.fromTo("#ph-load", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.9);
    tl.to("#ph-load", { opacity: 0, duration: 0.2, ease: "power2.in" }, 1.45);

    // Cards reais do site se abrem em profundidade a partir do celular.
    const cards = [
      ["#ph-card-1", 830, 390, 0.86],
      ["#ph-card-2", 770, -110, 0.74],
      ["#ph-card-3", -630, 350, 0.8],
      ["#ph-card-4", -570, -140, 0.9],
    ];
    cards.forEach(([sel, dx, dy, s], i) => {
      tl.fromTo(
        sel,
        { x: dx, y: dy, scale: 0.4, opacity: 0, filter: "blur(10px)" },
        { x: 0, y: 0, scale: s, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" },
        0.65 + i * 0.08,
      );
    });

    // A página rola até o plano Landing Page; os cards andam no sentido contrário (paralaxe).
    tl.fromTo("#ph-site", { y: 0 }, { y: -SCROLL_TO * K, duration: 1.4, ease: "power2.inOut" }, 2.0);
    tl.to(["#ph-card-1", "#ph-card-3"], { y: 40, duration: 1.4, ease: "power2.inOut" }, 2.0);
    tl.to(["#ph-card-2", "#ph-card-4"], { y: 70, duration: 1.4, ease: "power2.inOut" }, 2.0);

    // Os cards saem para fora do quadro e a câmera aproxima no botão.
    tl.to(["#ph-card-1", "#ph-card-2"], { x: -700, opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power3.in" }, 3.35);
    tl.to(["#ph-card-3", "#ph-card-4"], { x: 700, opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power3.in" }, 3.35);
    tl.to("#ph-camera", { scale: 1.7, y: -284, duration: 0.6, ease: "power2.inOut", transformOrigin: "50% 50%" }, 3.45);

    // O cursor entra pela direita e clica no botão "Quero minha landing page".
    tl.fromTo("#ph-cursor", { x: 1500, y: 980, opacity: 0 }, { x: 958, y: 703, opacity: 1, duration: 0.6, ease: "expo.out" }, 4.0);
    tl.to("#ph-cursor", { scale: 0.85, duration: 0.08, ease: "power2.in", transformOrigin: "10% 10%" }, 4.7);
    tl.to("#ph-cursor", { scale: 1, duration: 0.12, ease: "power2.out", transformOrigin: "10% 10%" }, 4.78);
    tl.fromTo("#ph-press", { opacity: 0 }, { opacity: 1, duration: 0.06 }, 4.7);
    tl.to("#ph-press", { opacity: 0, duration: 0.12 }, 4.82);

    // O clique abre a conversa a partir do próprio botão.
    tl.fromTo(
      "#ph-chat",
      { clipPath: "circle(0px at 209px 632px)" },
      { clipPath: "circle(1100px at 209px 632px)", duration: 0.4, ease: "power3.in" },
      4.82,
    );
    tl.to("#ph-cursor", { opacity: 0, duration: 0.15, ease: "power2.out" }, 4.95);
    tl.to("#ph-camera", { scale: 1.35, y: -132, duration: 0.6, ease: "power2.inOut" }, 5.0);

    // A mensagem é enviada, entregue e lida.
    tl.fromTo("#ph-bubble", { scale: 0.6, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, 5.3);
    tl.fromTo("#ph-tick-b", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 5.85);
    tl.to(["#ph-tick-a", "#ph-tick-b"], { stroke: "#0A0A0A", duration: 0.15 }, 6.15);
    tl.fromTo("#ph-typing", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.4)", transformOrigin: "0% 100%" }, 6.25);
    // Três pontinhos digitando, em ondas finitas.
    document.querySelectorAll(".ph-dot").forEach((dot, i) => {
      tl.fromTo(dot, { y: 0 }, { y: -6, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.4 + i * 0.1);
    });

    // Mergulho para dentro da tela: leva ao mundo 3D.
    tl.to("#ph-camera", { scale: 7, y: -600, filter: "blur(14px)", opacity: 0, duration: 0.55, ease: "power4.in" }, 6.82);
    tl.to("#ph-glow", { opacity: 0, duration: 0.4, ease: "power2.in" }, 6.95);
