<!doctype html>
<!--
  Encerramento: o V 3D chega girando e para de frente, uma luz passa pelo bisel, o nome VYREX,
  o preço de entrada e o botão vyrex.com.br entram e seguram até o fim.
  Seek-safe: render(t) puxado por um relógio GSAP linear.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VYREX — encerramento</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-800.woff2") format("woff2");
        font-weight: 800;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #en-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #en-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(640px 460px at 50% 36%, rgba(198, 255, 26, 0.2), transparent 72%);
      }
      #en-canvas {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      #en-word {
        position: absolute;
        left: 0;
        right: 0;
        top: 530px;
        text-align: center;
        font-family: "Unbounded";
        font-weight: 800;
        font-size: 140px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #f5f5f0;
      }
      #en-tag {
        position: absolute;
        left: 0;
        right: 0;
        top: 708px;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-size: 40px;
        color: #9b9b95;
      }
      #en-tag b {
        font-weight: 700;
        color: #f5f5f0;
      }
      #en-cta-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 790px;
        display: flex;
        justify-content: center;
      }
      #en-cta {
        padding: 20px 40px;
        border-radius: 10px;
        background: #c6ff1a;
        color: #0a0a0a;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 32px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-egjk"
      id="en-root"
      data-composition-id="end"
      data-start="0"
      data-duration="4.4"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-oi72" id="en-glow"></div>
      <canvas data-hf-id="hf-63ws" id="en-canvas" class="clip" data-start="0" data-duration="4.4" data-track-index="1"></canvas>
      <div data-hf-id="hf-2xs7" id="en-word">VYREX</div>
      <p data-hf-id="hf-0rco" id="en-tag">Sites a partir de <b data-hf-id="hf-9820">R$ 1.499</b></p>
      <div data-hf-id="hf-x1q2" id="en-cta-wrap"><div data-hf-id="hf-gkmm" id="en-cta">vyrex.com.br</div></div>
    </div>

    <script>
      (function () {
        var root = document.getElementById("en-root");
        var duration = Math.max(0.001, parseFloat(root.dataset.duration) || 4.4);
        var clock = { t: 0 };
        var scene = { duration: duration, clock: clock, render: null };
        window.__vyrexEnd = scene;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["end"] = new Promise(function (resolve) {
          scene.ready = resolve;
        });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (scene.render) scene.render(clock.t);
          },
        });
        tl.fromTo("#en-glow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(
          "#en-word",
          { clipPath: "inset(0% 100% 0% 0%)", filter: "blur(6px)" },
          { clipPath: "inset(0% 0% 0% 0%)", filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
          0.6,
        );
        tl.fromTo("#en-tag", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.0);
        tl.fromTo(
          "#en-cta",
          { clipPath: "inset(0% 100% 0% 0% round 10px)" },
          { clipPath: "inset(0% 0% 0% 0% round 10px)", duration: 0.45, ease: "expo.out" },
          1.2,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["end"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";

      const host = window.__vyrexEnd;
      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("en-canvas"),
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;

      const scene = new THREE.Scene();
      const studio = new THREE.Scene();
      studio.background = new THREE.Color(0x050505);
      const softbox = (w, h, x, y, z, color, power) => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }),
        );
        panel.position.set(x, y, z);
        panel.lookAt(0, 0, 0);
        studio.add(panel);
      };
      softbox(10, 2, 0, 7, 2, 0xffffff, 2.6);
      softbox(1.2, 7, -7, 1, 3, 0xffffff, 2);
      softbox(1.2, 7, 7, 0, 2, 0xffffff, 1.4);
      softbox(9, 1.4, 0, 0.5, -7, 0xc6ff1a, 1.6);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(studio, 0.02).texture;

      const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 100);
      camera.position.set(0, 0, 12);
      camera.lookAt(0, 0, 0);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a1a, 1.6));
      const key = new THREE.DirectionalLight(0xffffff, 1.4);
      key.position.set(-5, 5, 7);
      scene.add(key);
      // Luz que varre o bisel da esquerda para a direita.
      const sweep = new THREE.PointLight(0xffffff, 0, 9, 1.4);
      scene.add(sweep);

      const toShape = (pts) => {
        const s = new THREE.Shape();
        pts.forEach(([x, y], i) => {
          const X = (x - 60) / 40;
          const Y = (47.5 - y) / 40;
          if (i === 0) s.moveTo(X, Y);
          else s.lineTo(X, Y);
        });
        s.closePath();
        return s;
      };
      const extrude = { depth: 0.5, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.045, bevelSegments: 4 };
      const geoL = new THREE.ExtrudeGeometry(toShape([[0, 0], [32, 0], [49.65, 41.7], [40.25, 95]]), extrude);
      const geoR = new THREE.ExtrudeGeometry(toShape([[120, 0], [88, 0], [55.65, 41.7], [46.25, 95]]), extrude);
      geoL.translate(0, 0, -0.25);
      geoR.translate(0, 0, -0.25);
      const matL = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.15, roughness: 0.4, envMapIntensity: 1.3 });
      const matR = new THREE.MeshStandardMaterial({
        color: 0xc6ff1a,
        emissive: 0xc6ff1a,
        emissiveIntensity: 0.35,
        metalness: 0.4,
        roughness: 0.32,
      });
      const symbol = new THREE.Group();
      symbol.add(new THREE.Mesh(geoL, matL), new THREE.Mesh(geoR, matR));
      // Centro visual do símbolo um pouco à direita do centro da forma (as lâminas não são simétricas).
      symbol.children.forEach((m) => (m.position.x = 0.0));
      const holder = new THREE.Group();
      holder.add(symbol);
      holder.position.set(0, 1.07, 0);
      scene.add(holder);

      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp01(x)));
      const inOut = (x) => {
        const u = clamp01(x);
        return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      };
      const lerp = (a, b, k) => a + (b - a) * k;

      host.render = (t) => {
        const a = expoOut(t / 1.1);
        holder.rotation.y = lerp(-1.3, 0, a);
        holder.rotation.x = lerp(0.35, 0, a);
        holder.position.z = lerp(-5, 0, a);
        holder.scale.setScalar(0.75);
        const s = inOut((t - 0.5) / 1.3);
        sweep.position.set(lerp(-4, 4, s), 1.6, 2.2);
        sweep.intensity = 40 * Math.sin(Math.PI * s);
        renderer.render(scene, camera);
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
